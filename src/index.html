        <path class="page-loader__branch-line page-loader__branch-line--leaf" pathLength="1" d="M 242 12 C 248 10 252 2 246 0 C 240 -2 236 6 242 12 Z"></path>
        <path class="page-loader__branch-line page-loader__branch-line--leaf" pathLength="1" d="M 322 10 C 316 7 316 0 322 0 C 328 0 330 8 322 10 Z"></path>
        <path class="page-loader__branch-line page-loader__branch-line--leaf" pathLength="1" d="M 380 12 C 374 10 372 2 378 0 C 384 -2 388 8 380 12 Z"></path>
